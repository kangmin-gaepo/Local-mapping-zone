<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상권 영역 지정 · 관저1동 · 관저2동</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F5F4A">
<style>
:root{--bg:#EEF1F0;--panel:#FFFFFF;--ink:#1C2321;--sub:#5B6662;--line:#D5DBD8;--mapbg:#E4E8E6;--accent:#1F5F4A;--btn:#FFFFFF;--err:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151918;--panel:#1D2321;--ink:#E6ECE9;--sub:#9AA6A1;--line:#323B38;--mapbg:#202725;--accent:#4FA585;--btn:#252C2A;--err:#F2B8B5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151918;--panel:#1D2321;--ink:#E6ECE9;--sub:#9AA6A1;--line:#323B38;--mapbg:#202725;--accent:#4FA585;--btn:#252C2A;--err:#F2B8B5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:1fr 340px;height:100%}
#map{height:100%;background:var(--mapbg)}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
header{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:700;margin:0 0 4px}
.meta{font-size:13px;color:var(--sub);line-height:1.5}
.tools{padding:14px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--ink)}
button{font:inherit;font-size:14px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--sub);min-height:20px;line-height:1.5}
.hint.err{color:var(--err)}
.zones{flex:1;overflow:auto;padding:6px 20px}
.zone{border-bottom:1px solid var(--line);padding:14px 0}
.zone-head{display:flex;align-items:center;gap:10px}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.zone-name{font-weight:600;flex:1}
.zone-count{font-variant-numeric:tabular-nums;font-weight:700}
.cats{margin:8px 0 0 22px;font-size:13px;color:var(--sub);line-height:1.7}
.cats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.del{font-size:12px;padding:3px 8px;margin-left:6px}
.empty{color:var(--sub);font-size:14px;padding:18px 0;line-height:1.6}
footer{padding:14px 20px;border-top:1px solid var(--line);display:grid;gap:8px}
.leaflet-container{font-family:inherit}
#exportPanel{position:fixed;inset:0;z-index:2000;background:rgba(10,14,13,.55);display:none;align-items:center;justify-content:center;padding:16px}
#exportPanel.open{display:flex}
.ex-box{background:var(--panel);border-radius:10px;max-width:1100px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 280px}
.ex-prev{padding:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:300px}
.ex-prev canvas{max-width:100%;max-height:78vh;height:auto;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.ex-ctrl{padding:20px;display:grid;gap:12px;align-content:start}
.ex-ctrl label{font-size:13px;color:var(--sub);display:grid;gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.styles button{font-size:13px;padding:7px 8px}
.styles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12px;padding:4px 9px;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ex-ctrl label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
@media (max-width:760px){.ex-box{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:55vh 1fr;height:auto;min-height:100%}#map{height:55vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div id="map" aria-label="점포 분포 지도"></div>
  <aside>
    <header>
      <h1>관저1동 · 관저2동</h1>
      <div class="meta" id="meta"></div>
    </header>
    <div class="tools">
      <div class="row">
        <input type="text" id="zname" placeholder="상권 이름 (예: 별빛 코스)" aria-label="상권 이름">
        <button class="primary" id="drawBtn">그리기 시작</button>
      </div>
      <div class="row">
        <button id="finishBtn" disabled>영역 완성</button>
        <button id="undoBtn" disabled>점 하나 취소</button>
        <button id="cancelBtn" disabled>그리기 취소</button>
      </div>
      <div class="hint" id="hint">이름을 적고 그리기 시작을 누른 뒤, 지도에서 경계를 차례로 클릭하세요.</div>
    </div>
    <div class="zones" id="zones"></div>
    <footer>
      <div class="row">
        <button class="primary" id="xlsxBtn" disabled style="flex:1">엑셀 리포트</button>
        <button class="primary" id="imgBtn" disabled style="flex:1">지도 이미지 만들기</button>
      </div>
      <div class="row">
        <button id="saveBtn" disabled style="flex:1">상권 경계 저장</button>
        <button id="loadBtn" style="flex:1">상권 경계 불러오기</button>
      </div>
      <input type="file" id="loadFile" accept=".json,application/json" hidden>
      <div class="hint">그린 영역은 이 기기에 자동으로 기억됩니다. 다른 기기로 옮기거나 다음 분기 데이터와 비교할 때는 경계 파일(zones.json)을 저장해 두고 불러오세요.</div>
    </footer>
  </aside>
</div>
<div id="exportPanel" role="dialog" aria-modal="true" aria-label="지도 이미지 만들기">
  <div class="ex-box">
    <div class="ex-prev"><canvas id="exCanvas"></canvas></div>
    <div class="ex-ctrl">
      <label>스타일
        <div class="styles" id="exType">
          <button data-t="report" aria-pressed="true">보고서 지도</button>
          <button data-t="illust" aria-pressed="false">일러스트 지도</button>
          <button data-t="line" aria-pressed="false">코스 노선도</button>
          <button data-t="cards" aria-pressed="false">카드뉴스</button>
          <button data-t="poster" aria-pressed="false">밤하늘 맛지도</button>
        </div>
      </label>
      <label>표시할 업종
        <div class="chips" id="exCats"></div>
      </label>
      <label class="chk"><input type="checkbox" id="exCluster" checked> 같은 건물 점포를 하나로 묶기</label>
      <label class="chk"><input type="checkbox" id="exSmooth" checked> 경계 모서리 둥글게</label>
      <label class="chk"><input type="checkbox" id="exOutside"> 영역 밖 점포도 표시</label>
      <label>제목 <input type="text" id="exTitle"></label>
      <label>부제 <input type="text" id="exSub"></label>
      <div class="hint" id="exHint"></div>
      <button class="primary" id="exSave">PNG 이미지 내려받기</button>
      <button id="exClose">닫기</button>
    </div>
  </div>
</div>

function inside(lon, lat, poly) {
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}

let zones = [], draft = null, vertices = [];

function setHint(t, err) { $("hint").textContent = t; $("hint").classList.toggle("err", !!err); }
function setDrawing(on) {
  $("drawBtn").disabled = on; $("zname").disabled = on;
  $("finishBtn").disabled = !on; $("undoBtn").disabled = !on; $("cancelBtn").disabled = !on;

$("drawBtn").onclick = () => {
  const name = $("zname").value.trim();
  if (!name) { setHint("상권 이름을 먼저 적어주세요.", true); $("zname").focus(); return; }
  if (zones.some(z => z.name === name)) { setHint("같은 이름의 상권이 이미 있습니다.", true); return; }
  vertices = [];
  draft = L.polyline([], {color: COLORS[zones.length % COLORS.length], weight: 2, dashArray: "4 4"}).addTo(map);
  setDrawing(true); setHint("경계 지점을 클릭하세요. 3개 이상 찍은 뒤 영역 완성을 누릅니다.");
};
$("zname").addEventListener("input", () => setHint("이름을 적고 그리기 시작을 누른 뒤, 지도에서 경계를 차례로 클릭하세요."));
map.on("click", e => {
  if (!draft) return;
  vertices.push([e.latlng.lng, e.latlng.lat]);
  draft.setLatLngs(vertices.map(v => [v[1], v[0]]));
  setHint(`경계 점 ${vertices.length}개`);
});
$("undoBtn").onclick = () => { vertices.pop(); draft.setLatLngs(vertices.map(v => [v[1], v[0]])); setHint(`경계 점 ${vertices.length}개`); };
$("cancelBtn").onclick = () => { map.removeLayer(draft); draft = null; setDrawing(false); setHint("그리기를 취소했습니다."); };
$("finishBtn").onclick = () => {
  if (vertices.length < 3) { setHint("경계 점이 3개 이상 필요합니다.", true); return; }
  map.removeLayer(draft); draft = null;
  const name = $("zname").value.trim();
  addZone(name, vertices.slice()); $("zname").value = ""; setDrawing(false);
  recompute(); persist(); setHint(`${name} 지정 완료. 이 기기에 자동 저장했습니다.`);
};

function addZone(name, polygon) {
  const color = COLORS[zones.length % COLORS.length];
  const zone = {name, color, polygon};
  zone.layer = L.polygon(polygon.map(v => [v[1], v[0]]), {color, weight: 2, fillOpacity: .08}).addTo(map);
  zones.push(zone);
}

function recolor() {
  zones.forEach((z, i) => { z.color = COLORS[i % COLORS.length]; z.layer.setStyle({color: z.color}); });
}

// 이 기기(브라우저)에 경계 자동 기억
const STORE_KEY = "sangkwon-zones:" + DATA.areas.join(",");
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(zones.map(z => ({name: z.name, polygon: z.polygon})))); } catch (e) { /* 저장 공간 없음: 무시 */ }
}
function restoreLocal() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    if (Array.isArray(saved) && saved.length) {
      saved.forEach(z => addZone(z.name, z.polygon));
      recompute(); setHint(`이 기기에 저장된 상권 ${saved.length}개를 불러왔습니다.`);
    }
  } catch (e) { /* 저장본 없음 */ }
}

function recompute() {
  pts.forEach(p => { p._zone = null; });
  zones.forEach(z => {
    z.ids = []; z.adm = new Set(); z.cats = {};
    pts.forEach(p => {
      const [lon, lat, , cat, adm, id] = p._s;
      if (inside(lon, lat, z.polygon)) {
        z.ids.push(id); z.adm.add(adm); z.cats[cat] = (z.cats[cat] || 0) + 1;
        if (!p._zone) p._zone = z;
      }
    });
  });
  pts.forEach(p => p.setStyle(p._zone ? {fillColor: p._zone.color, radius: 4, fillOpacity: .95} : {fillColor: "#8A9490", radius: 3, fillOpacity: .6}));
  render();
}

function render() {
  $("saveBtn").disabled = zones.length === 0;
  $("xlsxBtn").disabled = zones.length === 0;
  $("imgBtn").disabled = zones.length === 0;
  if (!zones.length) { $("zones").innerHTML = EMPTY; return; }
  $("zones").innerHTML = "";
  zones.forEach((z, i) => {
    const top = Object.entries(z.cats).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const el = document.createElement("div"); el.className = "zone";
    el.innerHTML = `<div class="zone-head"><span class="sw" style="background:${z.color}"></span>
      <span class="zone-name"></span><span class="zone-count">${z.ids.length.toLocaleString()}개</span>
      <button class="del">삭제</button></div>
      <div class="cats">${top.length ? top.map(([c, n]) => `${c} <b>${n}</b>`).join("<br>") : "영역 안에 점포가 없습니다."}</div>`;
    el.querySelector(".zone-name").textContent = z.name;
    el.querySelector(".del").setAttribute("aria-label", `${z.name} 삭제`);
    el.querySelector(".del").onclick = () => {
      if (!confirm(`${z.name} 영역을 삭제할까요?`)) return;
      map.removeLayer(z.layer); zones.splice(i, 1); recolor(); recompute(); persist();
    };
    el.querySelector(".zone-head").ondblclick = () => map.fitBounds(z.layer.getBounds());
    $("zones").appendChild(el);
  });
}

}

const XLSX_SRC = ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",

function loadScript(src) {
  return new Promise((ok, fail) => { const t = document.createElement("script"); t.src = src; t.onload = ok; t.onerror = fail; document.head.appendChild(t); });
}
async function ensureXLSX() {
  for (const src of XLSX_SRC) { if (window.XLSX) break; try { await loadScript(src); } catch (e) {} }
  return !!window.XLSX;
}
function reportTables() {
  const cats = [...new Set(DATA.stores.map(s => s[3]))].sort();
  const summary = [["상권", "점포수", ...cats]];
  zones.forEach(z => summary.push([z.name, z.ids.length, ...cats.map(c => z.cats[c] || 0)]));
  const notes = [[`자료: ${DATA.source} (${DATA.ref} 기준)`], ["행정동 범위: " + DATA.areas.join(", ")],
    ["작성일: " + new Date().toLocaleDateString("ko-KR")], ["점포 위치 좌표 기준 집계이며, 경계선 위 점포는 결과가 달라질 수 있음"]];
  const list = [["상권", "상호명", "업종 대분류", "행정동코드", "상가업소번호"]];
  const byId = new Map(DATA.stores.map(s => [s[5], s]));
  zones.forEach(z => z.ids.forEach(id => { const s = byId.get(id); list.push([z.name, s[2], s[3], s[4], s[5]]); }));
  return {cats, summary, notes, list};
}
function saveBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("xlsxBtn").onclick = async () => {
  setHint("엑셀 리포트를 만드는 중입니다…");
  const {cats, summary, notes, list} = reportTables();
  const stamp = DATA.ref.replace(/\./g, "");
  if (await ensureXLSX()) {
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet([...summary, [], ...notes]); ws1["!cols"] = [{wch: 16}, {wch: 8}, ...cats.map(() => ({wch: 11}))];
    const ws2 = XLSX.utils.aoa_to_sheet(list); ws2["!cols"] = [{wch: 16}, {wch: 28}, {wch: 14}, {wch: 12}, {wch: 24}];
    XLSX.utils.book_append_sheet(wb, ws1, "상권별 요약");
    XLSX.utils.book_append_sheet(wb, ws2, "점포 목록");
    XLSX.writeFile(wb, `상권리포트_${stamp}.xlsx`);
    setHint("엑셀 리포트를 내려받았습니다.");
  } else {
    // 엑셀 라이브러리를 못 불러온 경우: 엑셀에서 한글이 깨지지 않는 CSV(UTF-8 BOM)로 대체
    const csv = rows => "\uFEFF" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    saveBlob(new Blob([csv([...summary, [], ...notes])], {type: "text/csv"}), `상권리포트_요약_${stamp}.csv`);
    setTimeout(() => saveBlob(new Blob([csv(list)], {type: "text/csv"}), `상권리포트_점포목록_${stamp}.csv`), 400);
    setHint("엑셀 기능을 불러오지 못해 CSV 두 개(요약, 점포목록)로 내려받았습니다. 엑셀에서 바로 열립니다.");

};

function projector(W0, H0, x0, y0, w, h, pad) {
  const ps = zones.flatMap(z => z.polygon);
  let [minX, minY, maxX, maxY] = [Infinity, Infinity, -Infinity, -Infinity];
  ps.forEach(([x, y]) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); });
  const k = Math.cos((minY + maxY) / 2 * Math.PI / 180);           // 경도 보정
  let gw = (maxX - minX) * k, gh = maxY - minY;
  const mx = gw * pad + 1e-5, my = gh * pad + 1e-5;
  minX -= mx / k; maxX += mx / k; minY -= my; maxY += my; gw = (maxX - minX) * k; gh = maxY - minY;
  const sc = Math.min(w / gw, h / gh);
  const ox = x0 + (w - gw * sc) / 2, oy = y0 + (h - gh * sc) / 2;
  const f = (lon, lat) => [ox + (lon - minX) * k * sc, oy + (maxY - lat) * sc];
  f.box = [minX, minY, maxX, maxY];
  return f;
}
let exCats = null;   // 표시 업종(Set), 용도 바꿀 때 기본값 지정
function chaikin(pts, n) {
  for (let k = 0; k < n; k++) {
    const out = [];
    pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length];
      out.push([.75 * p[0] + .25 * q[0], .75 * p[1] + .25 * q[1]], [.25 * p[0] + .75 * q[0], .25 * p[1] + .75 * q[1]]); });
    pts = out;
  }
  return pts;
}
function pathPoly(ctx, P, poly) {
  const xy = poly.map(([x, y]) => P(x, y)), n = xy.length;
  ctx.beginPath();
  if (!$("exSmooth").checked) { xy.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath(); return; }
  // 모서리만 둥글게(경계 안쪽 점포가 밖으로 보이지 않도록 반경 제한)
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  ctx.moveTo(...mid(xy[n - 1], xy[0]));
  xy.forEach((p, i) => {
    const q = xy[(i + 1) % n], o = xy[(i - 1 + n) % n];
    const r = Math.min(14, Math.hypot(p[0] - o[0], p[1] - o[1]) / 3, Math.hypot(q[0] - p[0], q[1] - p[1]) / 3);
    ctx.arcTo(p[0], p[1], ...mid(p, q), r);
  });
  ctx.closePath();
}
// 표시 대상 점포 → (같은 좌표끼리 묶은) 점 목록
function visibleDots(P) {
  const list = storesIn(P).filter(p => exCats.has(p._s[3]) && (p._zone || $("exOutside").checked));
  const groups = new Map();
  list.forEach(p => {
    const key = $("exCluster").checked ? p._s[0].toFixed(5) + "," + p._s[1].toFixed(5) : p._s[5];
    const g = groups.get(key) || {lon: p._s[0], lat: p._s[1], n: 0, zone: p._zone};
    g.n++; groups.set(key, g);
  });
  return [...groups.values()].sort((a, b) => b.n - a.n);
}
function countIn(z) { return z.ids.length ? Object.entries(z.cats).reduce((t, [c, n]) => t + (exCats.has(c) ? n : 0), 0) : 0; }
function centroid(P, poly) { let a = 0, b = 0; poly.forEach(([x, y]) => { const [u, v] = P(x, y); a += u; b += v; }); return [a / poly.length, b / poly.length]; }
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function topCats(z, n) { return Object.entries(z.cats).sort((a, b) => b[1] - a[1]).slice(0, n); }
function storesIn(P) {
  const [a, b, c, d] = P.box;
  return pts.filter(p => { const [x, y] = p._s; return x >= a && x <= c && y >= b && y <= d; });
}

function drawReport(cv, title, sub) {

  ctx.save(); rrect(ctx, mx, my, mw, mh, 10); ctx.clip();
  const P = projector(W, H, mx + 24, my + 24, mw - 48, mh - 48, 0.18);
  zones.forEach(z => { pathPoly(ctx, P, z.polygon); ctx.fillStyle = z.color + "1F"; ctx.fill(); });
  visibleDots(P).forEach(g => {
    const [x, y] = P(g.lon, g.lat), r = Math.min(4 + Math.sqrt(g.n - 1) * 3.2, 18);
    ctx.fillStyle = g.zone ? g.zone.color : "#B7BFBB"; ctx.globalAlpha = g.zone ? .85 : .6;
    ctx.beginPath(); ctx.arc(x, y, g.zone ? r : 3, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    if (g.zone && g.n >= 10) { ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#FFFFFF"; ctx.font = `700 ${r > 12 ? 13 : 11}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(g.n, x, y + 1); ctx.textAlign = "start"; ctx.textBaseline = "alphabetic"; }
  });
  zones.forEach(z => { pathPoly(ctx, P, z.polygon); ctx.strokeStyle = z.color; ctx.lineWidth = 3; ctx.stroke(); });
  zones.forEach(z => {
    const [cx, cy] = centroid(P, z.polygon);

  });
  ctx.restore();
  // 범례
  let y = my + 8; const lx = 1112;
  ctx.fillStyle = "#1C2321"; ctx.font = `700 22px ${FONT}`; ctx.fillText("상권별 점포 현황", lx, y + 18); y += 52;
  zones.forEach(z => {

    ctx.fillStyle = "#1C2321"; ctx.font = `700 21px ${FONT}`; ctx.fillText(z.name, lx + 28, y);
    ctx.font = `700 21px ${FONT}`; ctx.textAlign = "right"; ctx.fillText(`${countIn(z).toLocaleString()}개`, W - 64, y); ctx.textAlign = "start";
    y += 30; ctx.font = `400 17px ${FONT}`; ctx.fillStyle = "#5B6662";

    y += 18; ctx.strokeStyle = "#E1E6E3"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(lx, y - 14); ctx.lineTo(W - 64, y - 14); ctx.stroke(); y += 14;
  });
  ctx.fillStyle = "#8A9490"; ctx.font = `400 15px ${FONT}`;
  const allCats = new Set(DATA.stores.map(s => s[3]));

  ctx.fillText(`표시 업종: ${catNote} · ${$("exCluster").checked ? "원 크기와 숫자 = 같은 건물 점포 수" : "점 하나 = 점포 1곳"} · 점포 위치 좌표 기준 집계`, 64, H - 40);

function drawPoster(cv, title, sub) {

  ctx.fillStyle = "#1E2E52"; rrect(ctx, mx, my, mw, mh, 28); ctx.fill();
  ctx.save(); rrect(ctx, mx, my, mw, mh, 28); ctx.clip();
  const P = projector(W, H, mx + 40, my + 40, mw - 80, mh - 80, 0.12);
  zones.forEach((z, i) => { pathPoly(ctx, P, z.polygon); ctx.fillStyle = POSTER_COLORS[i % 6] + "33"; ctx.fill(); });
  visibleDots(P).forEach(g => {
    const [x, y] = P(g.lon, g.lat);
    if (!g.zone) { ctx.fillStyle = "rgba(255,255,255,.16)"; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill(); return; }
    const c = POSTER_COLORS[zones.indexOf(g.zone) % 6], r = Math.min(6 + Math.sqrt(g.n - 1) * 3.5, 20);
    ctx.fillStyle = c; ctx.globalAlpha = .18; ctx.beginPath(); ctx.arc(x, y, r * 1.9, 0, 7); ctx.fill();   // 은은한 빛
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();

  zones.forEach((z, i) => { pathPoly(ctx, P, z.polygon); ctx.strokeStyle = POSTER_COLORS[i % 6]; ctx.lineWidth = 4; ctx.setLineDash([14, 10]); ctx.stroke(); ctx.setLineDash([]); });
  zones.forEach((z, i) => {
    const [cx, cy] = centroid(P, z.polygon); const c = POSTER_COLORS[i % 6];
    ctx.font = `800 30px ${FONT}`; const tw = ctx.measureText(z.name).width + 44;
    ctx.fillStyle = c; rrect(ctx, cx - tw / 2, cy - 28, tw, 56, 28); ctx.fill();
    ctx.fillStyle = "#16233F"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(z.name, cx, cy + 1);
    ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
  });
  ctx.restore();
  // 코스 카드
  const n = zones.length, gap = 24, cw = (W - 120 - gap * (n - 1)) / n, cy0 = my + mh + 50;
  zones.forEach((z, i) => {
    const x = 60 + i * (cw + gap), c = POSTER_COLORS[i % 6];
    ctx.fillStyle = "#1E2E52"; rrect(ctx, x, cy0, cw, 250, 22); ctx.fill();
    ctx.fillStyle = c; rrect(ctx, x, cy0, cw, 10, [22, 22, 0, 0]); ctx.fill();
    ctx.textAlign = "center";
    ctx.fillStyle = c; ctx.font = `800 ${n > 3 ? 28 : 36}px ${FONT}`; ctx.fillText(z.name, x + cw / 2, cy0 + 82);
    ctx.fillStyle = "#FFF4DC"; ctx.font = `800 ${n > 3 ? 46 : 60}px ${FONT}`; ctx.fillText(`${countIn(z)}`, x + cw / 2, cy0 + 165);
    ctx.fillStyle = "#C9D2E6"; ctx.font = `500 22px ${FONT}`; ctx.fillText(exCats.size === 1 && exCats.has("음식") ? "곳의 음식점" : "곳의 점포", x + cw / 2, cy0 + 210);
    ctx.textAlign = "start";
  });
  ctx.fillStyle = "#8C9BBE"; ctx.font = `400 18px ${FONT}`; ctx.textAlign = "center";
  ctx.fillText(`표시: ${[...exCats].join("·")} · 자료: ${DATA.source} (${DATA.ref} 기준)`, W / 2, H - 50);
  ctx.textAlign = "start";
}

const PASTEL = ["#F7B267","#7FC8A9","#8EA7E9","#F497B6","#C9B6E4","#F2D16B"];
const DEEP = ["#C46A12","#2E8B6A","#3F5BB5","#C2457A","#7B5EA7","#A8860F"];
const ICON = {"음식":"🍜","소매":"🛍️","교육":"📚","예술·스포츠":"🎨","수리·개인":"✂️","보건의료":"💊",
              "과학·기술":"🔬","부동산":"🏠","시설관리·임대":"🔧","숙박":"🛏️"};
const EMOJI = s => `${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
const shownCats = z => topCats(z, 12).filter(([c]) => exCats.has(c));
const unitWord = () => exCats.size === 1 && exCats.has("음식") ? "음식점" : "점포";
function smoothPath(ctx, xy, iter) {
  const sm = chaikin(xy, iter); ctx.beginPath();
  sm.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
}
function titleBlock(ctx, W, title, sub, color, subColor, y, size) {
  ctx.textAlign = "center"; ctx.fillStyle = color; ctx.font = `800 ${size}px ${FONT}`; ctx.fillText(title, W / 2, y);
  if (sub) { ctx.fillStyle = subColor; ctx.font = `500 ${Math.round(size * .38)}px ${FONT}`; ctx.fillText(sub, W / 2, y + size * .72); }
  ctx.textAlign = "start";
}
function footer(ctx, W, H, color) {
  ctx.fillStyle = color; ctx.font = `400 17px ${FONT}`; ctx.textAlign = "center";
  ctx.fillText(`자료: ${DATA.source} (${DATA.ref} 기준) · 숫자는 선택 업종(${[...exCats].join("·")}) 기준`, W / 2, H - 40);
  ctx.textAlign = "start";
}

// ① 일러스트 지도: 점 대신 말랑한 구역 덩어리 + 업종 아이콘
function drawIllust(cv, title, sub) {
  const W = 1200, H = 1500; cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#EAF3F6"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#D5E6EC"; for (let x = 30; x < W; x += 40) for (let y = 30; y < H; y += 40) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }
  titleBlock(ctx, W, title, sub, "#22313F", "#4F6D7A", 150, 80);
  const P = projector(W, H, 90, 280, W - 180, 1020, 0.16);
  zones.forEach((z, i) => {
    const xy = z.polygon.map(([x, y]) => P(x, y));
    ctx.save(); ctx.translate(10, 14); smoothPath(ctx, xy, 4); ctx.fillStyle = "rgba(34,49,63,.10)"; ctx.fill(); ctx.restore();
    smoothPath(ctx, xy, 4); ctx.fillStyle = PASTEL[i % 6]; ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
  });
  zones.forEach((z, i) => {
    const [cx, cy] = centroid(P, z.polygon);
    const icons = shownCats(z).slice(0, 3).map(([c]) => ICON[c] || "📍");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = EMOJI(46); ctx.fillText(icons.join(" "), cx, cy - 62);
    ctx.font = `800 34px ${FONT}`; const tw = ctx.measureText(z.name).width + 48;
    ctx.fillStyle = "#FFFFFF"; rrect(ctx, cx - tw / 2, cy - 28, tw, 56, 28); ctx.fill();
    ctx.fillStyle = DEEP[i % 6]; ctx.fillText(z.name, cx, cy + 1);
    ctx.fillStyle = "#22313F"; ctx.font = `700 26px ${FONT}`;
    ctx.fillText(`${unitWord()} ${countIn(z).toLocaleString()}곳`, cx, cy + 56);
    ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
  });
  footer(ctx, W, H, "#6B8794");
}

// ② 코스 노선도: 지하철 노선도처럼 구역을 정거장으로
function drawLine(cv, title, sub) {
  const W = 1600, H = 900; cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#22313F"; ctx.font = `800 56px ${FONT}`; ctx.fillText(title, 90, 130);
  if (sub) { ctx.fillStyle = "#6B7B86"; ctx.font = `500 24px ${FONT}`; ctx.fillText(sub, 90, 176); }
  const P = projector(W, H, 0, 0, W, H, 0);
  const order = zones.map((z, i) => ({z, i, x: centroid(P, z.polygon)[0]})).sort((a, b) => a.x - b.x);
  const n = order.length, y = 470, x0 = 190, x1 = W - 190;
  const xs = order.map((_, k) => n === 1 ? W / 2 : x0 + (x1 - x0) * k / (n - 1));
  ctx.lineCap = "round";
  for (let k = 0; k < n - 1; k++) {
    ctx.strokeStyle = DEEP[order[k].i % 6]; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.moveTo(xs[k], y); ctx.lineTo((xs[k] + xs[k + 1]) / 2, y); ctx.stroke();
    ctx.strokeStyle = DEEP[order[k + 1].i % 6];
    ctx.beginPath(); ctx.moveTo((xs[k] + xs[k + 1]) / 2, y); ctx.lineTo(xs[k + 1], y); ctx.stroke();
  }
  order.forEach(({z, i}, k) => {
    const x = xs[k], c = DEEP[i % 6];
    ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = c; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(x, y, 38, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = c; ctx.font = `800 26px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(k + 1), x, y + 1); ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#22313F"; ctx.font = `800 ${n > 4 ? 28 : 36}px ${FONT}`; ctx.fillText(z.name, x, y - 74);
    ctx.fillStyle = c; ctx.font = `800 ${n > 4 ? 44 : 58}px ${FONT}`; ctx.fillText(countIn(z).toLocaleString(), x, y + 120);
    ctx.fillStyle = "#6B7B86"; ctx.font = `500 22px ${FONT}`; ctx.fillText(`곳의 ${unitWord()}`, x, y + 156);
    ctx.fillStyle = "#9AA6AE"; ctx.font = `500 17px ${FONT}`; ctx.fillText("주요 업종", x, y + 198);
    ctx.fillStyle = "#4F5D66"; ctx.font = `400 20px ${FONT}`;
    topCats(z, 3).forEach(([cat, m], j) => ctx.fillText(`${ICON[cat] || "·"} ${cat} ${m}`, x, y + 228 + j * 30));
    ctx.textAlign = "start";
  });
  footer(ctx, W, H, "#9AA6AE");
}

// ③ 카드뉴스: 구역 실루엣 + 업종 막대 (인스타 4:5)
function silhouette(ctx, poly, bx, by, bw, bh, color) {
  const lat0 = poly.reduce((t, p) => t + p[1], 0) / poly.length, k = Math.cos(lat0 * Math.PI / 180);
  const xs = poly.map(p => p[0] * k), ys = poly.map(p => p[1]);
  const [a, b, c, d] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const sc = Math.min(bw / (b - a || 1e-6), bh / (d - c || 1e-6)) * .9;
  const ox = bx + (bw - (b - a) * sc) / 2, oy = by + (bh - (d - c) * sc) / 2;
  smoothPath(ctx, poly.map(([x, y]) => [ox + (x * k - a) * sc, oy + (d - y) * sc]), 3);
  ctx.fillStyle = color; ctx.fill();
}
function drawCards(cv, title, sub) {
  const W = 1080, H = 1350; cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#F4F1FA"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#22313F"; ctx.font = `800 64px ${FONT}`; ctx.fillText(title, 70, 140);
  if (sub) { ctx.fillStyle = "#6B6880"; ctx.font = `500 26px ${FONT}`; ctx.fillText(sub, 70, 188); }
  const n = zones.length, gap = 22, avail = H - 240 - 110, rh = Math.min(250, (avail - gap * (n - 1)) / n);
  const top = 240 + (avail - (rh * n + gap * (n - 1))) / 2;
  const maxv = Math.max(1, ...zones.flatMap(z => topCats(z, 3).map(([, m]) => m)));
  zones.forEach((z, i) => {
    const y = top + i * (rh + gap), c = DEEP[i % 6];
    ctx.fillStyle = "#FFFFFF"; rrect(ctx, 50, y, W - 100, rh, 26); ctx.fill();
    ctx.fillStyle = PASTEL[i % 6]; rrect(ctx, 74, y + 22, rh - 44, rh - 44, 20); ctx.fill();
    silhouette(ctx, z.polygon, 84, y + 32, rh - 64, rh - 64, "#FFFFFF");
    const tx = 74 + rh - 44 + 34;
    ctx.fillStyle = c; ctx.font = `800 ${Math.min(36, rh * .16)}px ${FONT}`; ctx.fillText(z.name, tx, y + rh * .3);
    ctx.fillStyle = "#22313F"; ctx.font = `800 ${Math.min(54, rh * .24)}px ${FONT}`;
    const num = countIn(z).toLocaleString(); ctx.fillText(num, tx, y + rh * .62);
    const nw = ctx.measureText(num).width;
    ctx.fillStyle = "#6B6880"; ctx.font = `500 ${Math.min(22, rh * .1)}px ${FONT}`; ctx.fillText(`곳의 ${unitWord()}`, tx + nw + 10, y + rh * .62);
    const bx = 660, bwMax = W - 100 - bx;
    ctx.fillStyle = "#8D89A3"; ctx.font = `500 ${Math.min(17, rh * .075)}px ${FONT}`; ctx.fillText("주요 업종", bx, y + rh * .13);
    topCats(z, 3).forEach(([cat, m], j) => {
      const by = y + rh * (.3 + j * .23);
      ctx.fillStyle = "#3D3A50"; ctx.font = `500 ${Math.min(20, rh * .09)}px ${FONT}`; ctx.fillText(`${ICON[cat] || ""} ${cat}`, bx, by);
      ctx.fillStyle = "#ECE8F4"; rrect(ctx, bx, by + 8, bwMax - 60, 12, 6); ctx.fill();
      ctx.fillStyle = PASTEL[i % 6]; rrect(ctx, bx, by + 8, Math.max(12, (bwMax - 60) * m / maxv), 12, 6); ctx.fill();
      ctx.fillStyle = "#3D3A50"; ctx.textAlign = "right"; ctx.fillText(String(m), W - 74, by + 20); ctx.textAlign = "start";
    });
  });
  footer(ctx, W, H, "#8D89A3");
}

async function renderExport() {
  await document.fonts.ready;
  const t = $("exTitle").value.trim() || exDefaults()[0], s2 = $("exSub").value.trim();
  ({report: drawReport, poster: drawPoster, illust: drawIllust, line: drawLine, cards: drawCards})[exType]($("exCanvas"), t, s2);
  $("exHint").textContent = {
    report: "보고서·제안서용 가로형(1600×1000). 점포 위치를 그대로 보여줍니다.",
    illust: "현수막·안내판용 세로형(1200×1500). 구역을 일러스트처럼 단순화하고 대표 업종을 아이콘으로 표시합니다.",
    line: "가로형(1600×900). 구역을 서쪽부터 동쪽 순서의 정거장으로 이은 코스 안내도입니다.",
    cards: "인스타그램 카드뉴스 비율(1080×1350). 구역 모양과 업종 막대그래프를 함께 보여줍니다.",
    poster: "세로형(1200×1650) 밤하늘 톤 포스터. 점포 위치를 빛나는 점으로 표시합니다."
  }[exType] + " 숫자는 선택한 업종 기준이며, 음식에는 카페가 포함됩니다.";
  const hideDots = exType === "illust" || exType === "line" || exType === "cards";
  ["exCluster", "exOutside"].forEach(id => $(id).closest("label").style.display = hideDots ? "none" : "");
  $("exSmooth").closest("label").style.display = exType === "report" || exType === "poster" ? "" : "none";
}
function buildChips() {
  const cats = [...new Set(DATA.stores.map(s => s[3]))].sort();
  $("exCats").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button"); b.textContent = c; b.setAttribute("aria-pressed", String(exCats.has(c)));
    b.onclick = () => {
      if (exCats.has(c) && exCats.size === 1) return;   // 최소 1개 유지
      exCats.has(c) ? exCats.delete(c) : exCats.add(c);
      b.setAttribute("aria-pressed", String(exCats.has(c))); renderExport();
    };
    $("exCats").appendChild(b);
  });
}
function setExType(t) {
  exType = t;
  const all = [...new Set(DATA.stores.map(s => s[3]))];
  exCats = new Set(t !== "report" && all.includes("음식") ? ["음식"] : all);
  buildChips();
  document.querySelectorAll("#exType button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  [$("exTitle").value, $("exSub").value] = exDefaults();
  renderExport();
}
$("imgBtn").onclick = () => { $("exportPanel").classList.add("open"); setExType(exType); };
$("exClose").onclick = () => $("exportPanel").classList.remove("open");
$("exportPanel").addEventListener("click", e => { if (e.target.id === "exportPanel") $("exClose").onclick(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("exClose").onclick(); });
document.querySelectorAll("#exType button").forEach(b => b.onclick = () => setExType(b.dataset.t));
["exTitle", "exSub"].forEach(id => $(id).addEventListener("input", renderExport));
["exCluster", "exSmooth", "exOutside"].forEach(id => $(id).addEventListener("change", renderExport));
$("exSave").onclick = () => $("exCanvas").toBlob(async blob => {
  const name = `${($("exTitle").value.trim() || "상권지도").replace(/[\\/:*?"<>|]/g, "")}_${exType === "report" ? "보고서용" : "홍보용"}.png`;
  if (HOSTED && dl) { try { await dl.save({filename: name, data: blob}); } catch (e) {} return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}, "image/png");

$("loadBtn").onclick = () => $("loadFile").click();
$("loadFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); } catch (err) { setHint("경계 파일을 읽지 못했습니다. zones.json 파일인지 확인하세요.", true); return; }
  const list = Array.isArray(d.zones) ? d.zones : [];
  const valid = list.filter(z => z && typeof z.name === "string" && Array.isArray(z.polygon) && z.polygon.length >= 3
    && z.polygon.every(p => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite)));
  if (!valid.length) { setHint("파일 안에 불러올 상권 경계가 없습니다.", true); return; }
  let added = 0, skipped = [];
  valid.forEach(z => {
    if (zones.some(x => x.name === z.name)) { skipped.push(z.name); return; }
    addZone(z.name, z.polygon.map(p => p.slice())); added++;
  });
  recompute(); persist();
  if (added) map.fitBounds(L.featureGroup(zones.map(z => z.layer)).getBounds(), {padding: [30, 30]});
  let msg = `상권 ${added}개를 불러와 현재 데이터(${DATA.ref} 기준)로 다시 집계했습니다.`;
  if (d.ref && d.ref !== DATA.ref) msg += ` 경계는 ${d.ref} 기준 화면에서 그린 것입니다.`;
  if (skipped.length) msg += ` 이미 있는 이름이라 건너뜀: ${skipped.join(", ")}`;
  setHint(msg);
};

let dbRef = null, dl = null;
if (HOSTED && window.claude) {
  claude.use("db").then(async db => {
    if (!db) return;
    dbRef = db.doc("zones/current");
    try {
      const snap = await dbRef.get();
      const saved = snap.exists ? snap.data().zones : null;
      if (saved && saved.length && !zones.length) {
        saved.forEach(z => addZone(z.name, z.polygon.map(p => p.slice())));
        recompute(); setHint(`저장된 상권 ${saved.length}개를 불러왔습니다.`);
      }
    } catch (e) { /* 저장본 없음: 새로 시작 */ }
  });
  claude.use("downloads").then(d => { dl = d; });
}

if (!HOSTED) restoreLocal();
else setTimeout(() => { if (!zones.length) restoreLocal(); }, 1500);

$("saveBtn").onclick = async () => {
  const out = payload(), json = JSON.stringify(out, null, 2);
  if (!HOSTED) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], {type: "application/json"}));
    a.download = "zones.json"; a.click(); URL.revokeObjectURL(a.href);
    setHint("경계 파일(zones.json)을 저장했습니다. 다른 기기나 다음 분기 비교 때 불러오세요."); return;
  }
  if (!dbRef) { setHint("이 화면에서는 저장할 수 없습니다. 로그인 상태에서 다시 열어주세요.", true); return; }
  try { await dbRef.set(out); } catch (e) { setHint("저장하지 못했습니다: " + (e.code || e.message), true); return; }
  setHint(`상권 ${out.zones.length}개를 저장했습니다. 채팅에서 저장했다고 알려주세요.`);
  if (dl) { try { await dl.save({filename: "zones.json", data: json}); } catch (e) { /* 내려받기 거절은 정상 선택 */ } }
};
</script>
</body>
</html>
